<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume | JobMatch AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .navbar {
            width: 100%;
            padding: 22px 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #e2e8f0;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .upload-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 120px 20px 60px;
            width: 100%;
        }

        .upload-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 50px 44px;
            width: 100%;
            max-width: 520px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .upload-card h2 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .upload-card > p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .upload-area {
            border: 2px dashed rgba(56, 189, 248, 0.4);
            border-radius: 18px;
            padding: 44px 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(56, 189, 248, 0.03);
            margin-bottom: 28px;
        }

        .upload-area:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.07);
        }

        .upload-area.drag-over {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.08);
        }

        .upload-icon {
            font-size: 52px;
            margin-bottom: 16px;
        }

        .upload-area h3 {
            font-size: 18px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .upload-area p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 16px;
        }

        #selectedFile {
            display: inline-block;
            font-size: 13px;
            color: #38bdf8;
            font-weight: 500;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 16px;
            border-radius: 30px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #selectedFile.empty {
            color: #475569;
            background: rgba(255, 255, 255, 0.04);
        }

        .continue-btn {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
            opacity: 0.92;
        }

        .continue-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            display: block;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            display: block;
        }

        @media (max-width: 768px) {

            .navbar {
                padding: 20px;
            }

            .upload-card {
                padding: 36px 24px;
            }

            .upload-card h2 {
                font-size: 26px;
            }
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">JobMatch AI</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="jobs.html">Jobs</a>
            <a href="results.html">Results</a>
        </div>

    </nav>

    <section class="upload-section">

        <div class="upload-card">

            <h2>Upload Your Resume</h2>

            <p>Upload your resume to start AI-powered job matching</p>

            <div
                class="upload-area"
                id="uploadArea"
                onclick="document.getElementById('resumeFile').click()"
            >

                <input type="file" id="resumeFile" hidden accept=".pdf,.docx">

                <div class="upload-icon">📄</div>

                <h3>Click to Upload Resume</h3>

                <p>PDF and DOCX supported</p>

                <span id="selectedFile" class="empty">No file selected</span>

            </div>

            <button
                class="continue-btn"
                id="continueBtn"
                onclick="continueToJobs()"
            >
                Continue →
            </button>

            <div class="status" id="status"></div>

        </div>

    </section>

    <script>

        const fileInput    = document.getElementById('resumeFile');
        const selectedFile = document.getElementById('selectedFile');
        const uploadArea   = document.getElementById('uploadArea');
        const status       = document.getElementById('status');

        let uploadedFile = null;

        // ── File selected via click ──────────────────────────────
        fileInput.addEventListener('change', () => {

            uploadedFile = fileInput.files[0];

            if (uploadedFile) {
                selectedFile.innerText = uploadedFile.name;
                selectedFile.classList.remove('empty');
                status.className = 'status';          // hide any old message
            }

        });

        // ── Drag & Drop support ──────────────────────────────────
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');

            const file = e.dataTransfer.files[0];

            if (file) {
                uploadedFile = file;
                selectedFile.innerText = file.name;
                selectedFile.classList.remove('empty');
            }
        });

        // ── Continue button ──────────────────────────────────────
        function continueToJobs() {

            if (!uploadedFile) {
                status.textContent  = '⚠️ Please select a resume file first.';
                status.className    = 'status error';
                return;
            }

            const btn = document.getElementById('continueBtn');
            btn.disabled    = true;
            btn.textContent = 'Processing...';

            const reader = new FileReader();

            // readAsDataURL gives: "data:application/pdf;base64,JVBERi0x..."
            reader.readAsDataURL(uploadedFile);

            reader.onload = function () {

                // ── KEY: save under "resumeFile" ─────────────────
                // jobs.html will read this same key
                sessionStorage.setItem('resumeFile',     reader.result);
                sessionStorage.setItem('resumeFileName', uploadedFile.name);

                status.textContent = '✅ Resume uploaded! Redirecting to jobs...';
                status.className   = 'status success';

                setTimeout(() => {
                    window.location.href = 'jobs.html';
                }, 1000);

            };

            reader.onerror = function () {

                status.textContent  = '❌ Failed to read file. Try again.';
                status.className    = 'status error';
                btn.disabled        = false;
                btn.textContent     = 'Continue →';

            };

        }

    </script>

</body>
</html>
