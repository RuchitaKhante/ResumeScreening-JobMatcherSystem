<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs | JobMatch AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            padding: 22px 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #e2e8f0;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .container {
            padding: 130px 60px 60px;
        }

        .heading {
            text-align: center;
            margin-bottom: 50px;
        }

        .heading h1 {
            font-size: 52px;
            margin-bottom: 12px;
        }

        .heading p {
            color: #94a3b8;
            font-size: 18px;
        }

        /* ── Resume badge shown at top ── */
        .resume-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .resume-badge span {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 30px;
        }

        .resume-badge a {
            color: #64748b;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }

        .resume-badge a:hover {
            color: #94a3b8;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .job-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px;
            transition: 0.3s;
            backdrop-filter: blur(20px);
        }

        .job-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            border-color: #38bdf8;
        }

        .job-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .company {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .location {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .salary {
            color: #22c55e;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 16px;
        }

        .description {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .match-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .match-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
        }

        .match-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .match-btn.loading::after {
            content: ' ⏳';
        }

        @media (max-width: 768px) {

            .navbar {
                padding: 20px;
            }

            .container {
                padding: 120px 20px 40px;
            }

            .heading h1 {
                font-size: 34px;
            }
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">JobMatch AI</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="upload.html">Upload Resume</a>
            <a href="results.html">Results</a>
        </div>

    </nav>

    <div class="container">

        <div class="heading">
            <h1>Find Your Perfect Job</h1>
            <p>AI Powered Resume Screening & Job Matching</p>
        </div>

        <!-- Shows which resume is loaded + option to change it -->
        <div class="resume-badge" id="resumeBadge" style="display:none;">
            <span id="resumeNameLabel">📄 resume.pdf loaded</span>
            <a onclick="changeResume()">Change resume</a>
        </div>

        <div class="jobs-grid" id="jobsGrid"></div>

    </div>

    <script>

        // ════════════════════════════════════════════════════════
        //  STEP 1 — Read resume from sessionStorage
        //           Key must match what upload.html saved: "resumeFile"
        // ════════════════════════════════════════════════════════

        const storedDataURL  = sessionStorage.getItem('resumeFile');      // "data:...;base64,XXXX"
        const storedFileName = sessionStorage.getItem('resumeFileName');   // "myresume.pdf"

        if (!storedDataURL || !storedFileName) {

            // Nothing saved → go back to upload
            alert('Please upload your resume first.');
            window.location.href = 'upload.html';

        } else {

            // Show resume badge
            const badge = document.getElementById('resumeBadge');
            badge.style.display = 'flex';
            document.getElementById('resumeNameLabel').textContent =
                '📄 ' + storedFileName + ' loaded';

            // ── Convert base64 data URL → Blob ───────────────────
            // storedDataURL looks like: "data:application/pdf;base64,JVBERi0x..."
            // We must strip the prefix before passing to atob()

            const base64Data     = storedDataURL.split(',')[1];   // ← THE KEY FIX
            const byteCharacters = atob(base64Data);

            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }

            const byteArray     = new Uint8Array(byteNumbers);
            window.resumeBlob   = new Blob([byteArray], { type: 'application/pdf' });

        }

        // ════════════════════════════════════════════════════════
        //  STEP 2 — Job listings (ONLY descriptions expanded)

            },
            {

            },
            {
                title:       "Software Engineer",
                company:     "Tech Mahindra",
                location:    "Pune",

                description: "We are hiring a Software Engineer with strong programming skills in Java, C++, or Python and a solid understanding of data structures, algorithms, and object-oriented design principles. The candidate must be proficient in working with relational databases like MySQL or Oracle, writing optimized SQL queries, and developing RESTful APIs. Knowledge of software development lifecycle, version control using Git, and agile development methodology is required. Experience with design patterns, system design concepts, unit testing, and code reviews is highly desirable. Good communication skills and ability to work in a collaborative team environment are essential."

        // ════════════════════════════════════════════════════════
        //  STEP 3 — Render job cards
        // ════════════════════════════════════════════════════════

        const jobsGrid = document.getElementById('jobsGrid');

        jobs.forEach(function (job, index) {

            const card = document.createElement('div');
            card.className = 'job-card';

            card.innerHTML = `
                <div class="job-title">${job.title}</div>
                <div class="company">${job.company}</div>
                <div class="location">📍 ${job.location}</div>
                <div class="salary">💰 ${job.salary}</div>
                <div class="description">${job.description}</div>
                <button class="match-btn" id="btn-${index}">
                    🔍 Check Match
                </button>
            `;

            jobsGrid.appendChild(card);

            document
                .getElementById(`btn-${index}`)
                .addEventListener('click', function () {
                    checkMatch(job.title, job.description, index);
                });

        });

        // ════════════════════════════════════════════════════════
        //  STEP 4 — Check Match (sends resume + job to Python API)
        // ════════════════════════════════════════════════════════

        async function checkMatch(jobTitle, jobDescription, index) {

            // Guard: resumeBlob must exist (set in STEP 1 above)
            if (!window.resumeBlob) {
                alert('Resume data missing. Please upload again.');
                window.location.href = 'upload.html';
                return;
            }

            const btn = document.getElementById(`btn-${index}`);
            btn.disabled    = true;
            btn.textContent = 'Checking...';
            btn.classList.add('loading');

            try {

                const formData = new FormData();
                formData.append('resume',          window.resumeBlob, storedFileName);
                formData.append('job_description', jobDescription);

                const response = await fetch('http://127.0.0.1:8000/match-resume', {
                    method: 'POST',
                    body:   formData
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                sessionStorage.setItem('matchScore', data.similarity_score);
                sessionStorage.setItem('jobTitle',   jobTitle);

                window.location.href = 'results.html';

            } catch (error) {

                console.error('Match error:', error);
                alert('Error while checking match. Make sure your Python server is running on port 8000.');

                btn.disabled    = false;
                btn.textContent = '🔍 Check Match';
                btn.classList.remove('loading');

            }

        }

        // ════════════════════════════════════════════════════════
        //  Helper — Change resume (clears session, goes to upload)
        // ════════════════════════════════════════════════════════

        function changeResume() {
            sessionStorage.removeItem('resumeFile');
            sessionStorage.removeItem('resumeFileName');
            window.location.href = 'upload.html';
        }

    </script>

</body>
</html>
